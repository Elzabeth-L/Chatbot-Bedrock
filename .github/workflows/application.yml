name: Application CI and Images

on:
  pull_request:
    paths:
      - "frontend/**"
      - "lambdas/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "sonar-project.properties"
      - ".github/workflows/application.yml"
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "lambdas/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "sonar-project.properties"
      - ".github/workflows/application.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Unit tests with coverage
        run: pytest --cov=lambdas --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error

  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  supply-chain:
    name: SCA and Snyk security
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect Snyk configuration
        id: snyk_config
        shell: bash
        run: |
          if [[ -n "${SNYK_TOKEN}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Snyk scans are skipped on this non-publishing run because SNYK_TOKEN is not configured."
          fi

      - name: GitHub dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - id: snyk_setup
        if: steps.snyk_config.outputs.enabled == 'true'
        uses: snyk/actions/setup@v1.0.0

      - name: Snyk Open Source SCA
        if: steps.snyk_setup.outcome == 'success'
        id: snyk_sca
        run: >-
          snyk test
          --file=requirements-dev.txt
          --package-manager=pip
          --severity-threshold=high
          --sarif-file-output=snyk-open-source.sarif

      - name: Upload Snyk SCA SARIF
        if: always() && hashFiles('snyk-open-source.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-open-source.sarif
          category: snyk-open-source

      - name: Snyk Code SAST
        if: always() && steps.snyk_setup.outcome == 'success'
        run: >-
          snyk code test
          --severity-threshold=high
          --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code SARIF
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Require Snyk for publication
        if: >-
          always() &&
          steps.snyk_config.outputs.enabled != 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', vars.DEFAULT_BRANCH)))
        shell: bash
        run: |
          echo "SNYK_TOKEN must be configured before an image can be published." >&2
          exit 1

  sonarcloud:
    name: SonarCloud analysis
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}

      - name: Detect SonarCloud configuration
        id: sonar_config
        shell: bash
        run: |
          if [[ -n "${SONAR_TOKEN}" && -n "${SONAR_ORGANIZATION}" && -n "${SONAR_PROJECT_KEY}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::SonarCloud is skipped on this non-publishing run because its secret or variables are not configured."
          fi

      - if: steps.sonar_config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - if: steps.sonar_config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 300

      - name: Require SonarCloud for publication
        if: >-
          always() &&
          steps.sonar_config.outputs.enabled != 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', vars.DEFAULT_BRANCH)))
        shell: bash
        run: |
          echo "SONAR_TOKEN, SONAR_ORGANIZATION, and SONAR_PROJECT_KEY must be configured before publication." >&2
          exit 1

  container-scan:
    name: Scan ${{ matrix.component }} image
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, codeql, supply-chain, sonarcloud]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            context: lambdas/chat
            dockerfile: lambdas/chat/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build local scan image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: local/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.component }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Snyk container scan
        if: always() && env.SNYK_TOKEN != ''
        uses: snyk/actions/docker@v1.0.0
        with:
          image: local/${{ matrix.component }}:${{ github.sha }}
          args: >-
            --file=${{ matrix.dockerfile }}
            --severity-threshold=high
            --sarif-file-output=snyk-${{ matrix.component }}.sarif

      - name: Upload Snyk container SARIF
        if: always() && hashFiles(format('snyk-{0}.sarif', matrix.component)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-${{ matrix.component }}.sarif
          category: snyk-container-${{ matrix.component }}

      - name: Export exact scanned image
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', vars.DEFAULT_BRANCH)))
        run: docker save --output scanned-${{ matrix.component }}.tar local/${{ matrix.component }}:${{ github.sha }}

      - name: Preserve exact scanned image
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', vars.DEFAULT_BRANCH)))
        uses: actions/upload-artifact@v4
        with:
          name: scanned-${{ matrix.component }}-${{ github.sha }}
          path: scanned-${{ matrix.component }}.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.component }} image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', vars.DEFAULT_BRANCH))
    needs: container-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            context: lambdas/chat
            dockerfile: lambdas/chat/Dockerfile
    env:
      IMAGE_NAME: ${{ matrix.component == 'frontend' && vars.GHCR_FRONTEND_IMAGE || vars.GHCR_BACKEND_IMAGE }}
    steps:
      - name: Validate image destination
        shell: bash
        run: |
          test -n "${IMAGE_NAME}" || { echo "The GHCR image GitHub Variable is required." >&2; exit 1; }
          case "${IMAGE_NAME}" in ghcr.io/*) ;; *) echo "Image destination must start with ghcr.io/." >&2; exit 1 ;; esac

      - uses: actions/download-artifact@v4
        with:
          name: scanned-${{ matrix.component }}-${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', vars.DEFAULT_BRANCH) }}

      - name: Publish the exact scanned image
        id: publish
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          docker load --input scanned-${{ matrix.component }}.tar
          while IFS= read -r tag; do
            test -n "${tag}" || continue
            docker tag "local/${{ matrix.component }}:${GITHUB_SHA}" "${tag}"
            docker push "${tag}"
          done <<< "${IMAGE_TAGS}"
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "${digest}" || { echo "Unable to resolve published digest." >&2; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
